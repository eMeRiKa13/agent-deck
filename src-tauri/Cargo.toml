[package]
name = "agent-deck"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eMeRiKa13/agent-deck"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }
walkdir = "2"

# Keep local builds debuggable without retaining full symbols for the large
# third-party Tauri dependency graph. Full symbols remain available by
# overriding the profile when a native debugging session needs them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
